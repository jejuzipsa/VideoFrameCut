name: FrameCut build and core tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core tests
        run: dotnet run --configuration Release --project tests/VideoFrameCut.Core.Tests/VideoFrameCut.Core.Tests.csproj
      - name: FFmpeg first-run bootstrap safety tests
        run: dotnet run --configuration Release --project tests/VideoFrameCut.Dependencies.Tests/VideoFrameCut.Dependencies.Tests.csproj
      - name: Build CLI
        run: dotnet build src/VideoFrameCut.Cli/VideoFrameCut.Cli.csproj --configuration Release
      - name: Build Windows WPF app
        run: dotnet build src/VideoFrameCut.App/VideoFrameCut.App.csproj --configuration Release
      - name: WPF dark-theme resource smoke test
        run: dotnet run --configuration Release --project tests/VideoFrameCut.Theme.Tests/VideoFrameCut.Theme.Tests.csproj
      - name: Publish Windows x64 preview (self-contained)
        run: dotnet publish src/VideoFrameCut.App/VideoFrameCut.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output publish/win-x64
      - name: Keep only x64 VLC native binaries and validate packaged codecs
        shell: pwsh
        run: |
          $base = 'publish/win-x64/libvlc'
          $vlc = Join-Path $base 'win-x64'
          foreach ($arch in @('win-arm64', 'win-x86')) {
            $unneeded = Join-Path $base $arch
            if (Test-Path $unneeded) { Remove-Item $unneeded -Recurse -Force }
          }
          foreach ($file in @('libvlc.dll', 'libvlccore.dll')) {
            if (-not (Test-Path (Join-Path $vlc $file))) {
              throw "Portable x64 VLC runtime missing $file"
            }
          }
          $plugins = Join-Path $vlc 'plugins'
          if (-not (Test-Path $plugins)) { throw 'Portable x64 VLC plugins missing' }
          $avcodec = @(Get-ChildItem $plugins -File -Recurse -Filter '*avcodec*plugin.dll')
          if ($avcodec.Count -eq 0) { throw 'LibVLC libavcodec decoder plugin missing' }
          Write-Host 'Native VLC runtime ready:' $vlc
          Write-Host 'Video decoder plugin:' $avcodec[0].FullName
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: FrameCut-win-x64-preview
          path: publish/win-x64/
          if-no-files-found: error

  test-media:
    # Pin a known FFmpeg toolchain for deterministic numbered-frame fixtures.
    # FFmpeg 8 VFR compatibility is tracked separately, not declared passed here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: FFmpeg version
        run: ffmpeg -version | head -n 1
      - name: Exercise FFmpeg export and verify numbered frames
        run: python3 scripts/test_frame_export.py
